<svg xmlns="http://www.w3.org/2000/svg" width="480" height="280" viewBox="0 0 480 280" role="img" aria-labelledby="title desc">
  <title id="title">エアコンのタイマー表示例</title>
  <desc id="desc">冷房26℃、切タイマー3時間後。設定したときから数える方式。</desc>
  <rect width="480" height="280" rx="18" fill="#f5f7f4"/>
  <text x="240" y="37" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#263d36">エアコンの表示</text>
  <rect x="74" y="56" width="332" height="175" rx="16" fill="#e7eee7" stroke="#476b5d" stroke-width="3"/>
  <g font-family="sans-serif" fill="#263d36" text-anchor="middle">
    <text x="240" y="97" font-size="25">冷房　26℃</text>
    <path d="M94 116H386" stroke="#9ab2a4" stroke-width="2"/>
    <text x="240" y="153" font-size="23">切タイマー</text>
    <text x="240" y="203" font-size="36" font-weight="bold">3時間後</text>
    <text x="240" y="259" font-size="18">設定したときから数える方式</text>
  </g>
</svg>
